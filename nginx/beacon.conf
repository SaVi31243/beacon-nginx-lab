server {
    listen 8080 default_server;
    server_name _;
    root /opt/beacon/public;

    location = / {
        try_files /index.html =404;
    }

    location = /health.json {
        try_files $uri =404;
    }

    location = /missing-page {
        return 200 "not found";
    }

    location / {
        try_files $uri =404;
    }
}
